<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbloom — a garden at the edge of night</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03040d; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; cursor: crosshair; touch-action: none; user-select: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Orbloom: plant seeds on a tiny world and defend its garden from the Gloam for twelve nights"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
